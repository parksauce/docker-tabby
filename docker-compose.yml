version: '3'
services:

  tabby:
    image: parksauce/tabby
    container_name: tabby
    ports:
      - ${PORT:-8010}:80
    environment:
      - TZ=${TZ:-America/New_York}
      # Mail server configuration
      - TABBY_SMTP_USER=${TABBY_SMTP_USER}
      - TABBY_SMTP_PASS=${TABBY_SMTP_PASS}
      - TABBY_SMTP_HOST=${TABBY_SMTP_HOST}
      - TABBY_SMTP_PORT=${TABBY_SMTP_PORT:-465}
      - TABBY_SMTP_AUTH_METHOD=${TABBY_SMTP_AUTH_METHOD:-LOGIN}
      - TABBY_SMTP_USE_TLS=${TABBY_SMTP_USE_TLS:-Yes}
      - TABBY_SMTP_USE_STARTTLS=${TABBY_SMTP_USE_STARTTLS:-No}
    volumes:
      - ./tabby:/config
    restart: unless-stopped

  db:
    image: linuxserver/mariadb
    container_name: tabby-db
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=${TZ:-America/New_York}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-tabby}
      - MYSQL_USER=${MYSQL_USER:-tabby}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ./db:/config
    restart: unless-stopped

